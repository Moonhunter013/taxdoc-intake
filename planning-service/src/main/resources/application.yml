server:
  port: 8080

spring:
  application:
    name: planning-service

  # Federal limits and rates by tax year (issue #20). Kept in their own file because they
  # change every year and each value carries its source link.
  config:
    import: classpath:tax-years.yml

  # Planning's own schema and user (ADR-0003); never extraction's tables.
  # docker compose overrides these with SPRING_DATASOURCE_* environment variables.
  datasource:
    url: ${PLANNING_DB_URL:jdbc:mysql://localhost:3306/planning}
    username: ${PLANNING_DB_USER:planning}
    password: ${PLANNING_DB_PASSWORD:}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it, and refuses to
    # start if they don't, so a forgotten migration fails fast instead of at runtime.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

taxdoc:
  # Planning reads documents through extraction's API, never its database (ADR-0003).
  # docker compose sets EXTRACTION_BASE_URL to the extraction-service container.
  extraction:
    base-url: ${EXTRACTION_BASE_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
