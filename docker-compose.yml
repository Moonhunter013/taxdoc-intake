# Local development stack. Usage:
#   cp .env.example .env   (then edit passwords)
#   docker compose up --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taxdoc}
      MYSQL_USER: ${MYSQL_USER:-taxdoc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  extraction-service:
    build: ./extraction-service
    environment:
      EXTRACTION_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-taxdoc}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-taxdoc}
      EXTRACTION_S3_BUCKET: ${EXTRACTION_S3_BUCKET:-}
      EXTRACTION_AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  planning-service:
    build: ./planning-service
    # Datasource settings (SPRING_DATASOURCE_*) are added in Week 2 with JPA + Flyway.
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
