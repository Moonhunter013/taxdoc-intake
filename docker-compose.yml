# Local development stack. Usage:
#   cp .env.example .env   (then edit passwords)
#   docker compose up --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taxdoc}
      MYSQL_USER: ${MYSQL_USER:-taxdoc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      # Used by db/init/02-planning-db.sh to create planning-service's own schema and user.
      PLANNING_DB_PASSWORD: ${PLANNING_DB_PASSWORD:?set in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Must ping over TCP, not "-h localhost" (which uses the Unix socket). On first start the
      # entrypoint runs a temporary server with networking disabled while it executes
      # db/init/*, then restarts it. A socket ping reports healthy during that phase, so
      # dependent services start, connect over the network and get "Connection refused".
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  extraction-service:
    build: ./extraction-service
    environment:
      EXTRACTION_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-taxdoc}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-taxdoc}
      EXTRACTION_S3_BUCKET: ${EXTRACTION_S3_BUCKET:-}
      EXTRACTION_AWS_REGION: ${AWS_REGION:-us-east-1}
      EXTRACTION_TIN_HMAC_KEY: ${EXTRACTION_TIN_HMAC_KEY:?set in .env}
      # Local development only: S3/Textract use your CLI profile (aws configure --profile taxdoc),
      # read from the mounted ~/.aws below. In AWS (Week 4) leave both out; ECS gives the task an
      # IAM role instead.
      AWS_PROFILE: ${AWS_PROFILE:-taxdoc}
    volumes:
      # Read-only. HOME on Mac/Linux, USERPROFILE on Windows (PowerShell doesn't export HOME).
      # The image runs as appuser, hence /home/appuser. Trade-off accepted for local dev
      # (2026-10-26): the container can read every profile in ~/.aws, not only taxdoc. If the
      # folder doesn't exist, compose still starts and uploads fail with "no credentials".
      - ${HOME:-${USERPROFILE}}/.aws:/home/appuser/.aws:ro
    # Apply database migrations, then start the API.
    command: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  planning-service:
    build: ./planning-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/planning
      SPRING_DATASOURCE_USERNAME: planning
      SPRING_DATASOURCE_PASSWORD: ${PLANNING_DB_PASSWORD:?set in .env}
      # No depends_on for extraction: planning starts without it and returns 503 while it's down.
      EXTRACTION_BASE_URL: http://extraction-service:8000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
