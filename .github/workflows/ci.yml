name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extraction-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extraction-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  planning-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planning-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  docker-build:
    runs-on: ubuntu-latest
    needs: [extraction-service, planning-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t extraction-service ./extraction-service
      - run: docker build -t planning-service ./planning-service
